name: ETL

on:
  push:
    branches: [main]
  schedule:
    # Daily 06:00 UTC = 01:00 Dallas (CST) / 02:00 (CDT) — before market opens
    - cron: "0 6 * * *"
    # Weekly Sunday 06:30 UTC — extra slot for sold + DCAD + scorecards
    - cron: "30 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | manual"
        required: false
        default: "manual"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 6 * * 0" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      # The eligibility gate reads cached DISD attendance polygons, and DISD
      # redraws them annually. Without this the gate would silently score
      # against stale boundaries for months. --refresh only overwrites the cache
      # when every allowlisted zone comes back, so a DISD outage or a renamed
      # school leaves the good file in place and this step just fails soft.
      - name: Refresh DISD school zones (weekly only)
        if: steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'manual'
        continue-on-error: true
        run: python -m scrapers.school_zones --refresh

      # Tolerated on purpose. The scraper now exits non-zero rather than
      # overwriting a good snapshot with zero rows when Redfin captchas, which
      # would otherwise fail this job and block the Pages deploy entirely -- the
      # site would quietly stop updating. Instead: keep the last good data, let
      # the rest of the pipeline run on it, and let the dashboard say so. The
      # watchlist carries listings_as_of / listings_age_days and the Watchlist
      # tab renders the scrape date in red once it is 7+ days old, so stale data
      # is visible rather than silent. Genuine code failures in score/aggregate
      # below are NOT tolerated and still fail the run.
      - name: Scrape active listings (Redfin)
        continue-on-error: true
        run: python -m scrapers.redfin --status active

      - name: Score watchlist
        run: python -m pipeline.score

      - name: Scrape sold comps (weekly only)
        if: steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'manual'
        continue-on-error: true
        run: python -m scrapers.redfin --status sold --rate-seconds 6

      - name: Refresh DCAD parcels (weekly only)
        if: steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'manual'
        continue-on-error: true
        run: python -m scrapers.dcad

      - name: Build sub-area scorecards
        run: python -m pipeline.aggregate

      - name: Commit data snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # school_zones.geojson is included so an annual boundary redraw is
          # captured in history alongside the snapshot it first affected.
          git add data/ config/school_zones.geojson
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh ${{ steps.mode.outputs.mode }} run $(date -u +%Y-%m-%d)"
          # Race-resilient push: if main advanced during the run (e.g., a
          # manual commit), rebase our data commit on top and retry up to
          # three times. Avoids the "rejected (fetch first)" failure.
          for attempt in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt; pulling --rebase and retrying"
            git pull --rebase --autostash origin main
          done
          echo "push failed after 3 attempts"
          exit 1

  build-and-deploy:
    needs: etl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # data/stats/ is derived and no longer committed, so this job -- which is a
      # fresh checkout, separate from etl -- has to rebuild it from the inputs the
      # etl job just committed. Cheap (well under a second) and it makes the site a
      # deterministic function of committed inputs + code rather than of whatever
      # happened to be checked in. The data loaders throw if this is skipped, so a
      # missing step fails the build instead of publishing an empty watchlist.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild derived stats from committed inputs
        run: |
          python -m pipeline.score
          python -m pipeline.aggregate

      - run: npm ci || npm install
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
